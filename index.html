<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09110f" />
    <meta name="description" content="桌面上的小型活世界。在浏览器或壁纸上探索一条水草丰茂的河流、一片珊瑚礁、一条斗鱼、一颗等离子球、一方锦鲤池或一堆篝火。" />
    <title>Deskworlds — 桌面上的活世界</title>
    <link rel="icon" href="ui/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="ui/gallery.css" />
  </head>
  <body>
    <header class="masthead">
      <h1><svg class="logo" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5 43 15.5 24 26 5 15.5Z" fill="currentColor" stroke-width="3.5"/><path d="M24 5 43 15.5V31.5L24 42 5 31.5V15.5ZM24 26V42" stroke-width="3.5"/><path d="M5 21C6.55 22.2 8.17 23.52 9.75 24.12C11.33 24.72 12.93 24.64 14.5 25.16C16.07 25.68 17.65 26.96 19.25 28.38C20.85 29.8 22.38 30.9 24 31.5C25.62 30.83 27.15 29.57 28.75 28.2C30.35 26.83 31.9 25.75 33.5 25.37C35.1 24.99 36.65 25.02 38.25 24.3C39.85 23.58 41.38 22.1 43 21M5 26.3C6.55 27.52 8.17 28.21 9.75 28.54C11.33 28.87 12.93 29.22 14.5 30.37C16.07 31.52 17.65 33.36 19.25 34.56C20.85 35.76 22.38 36.27 24 36.8C25.62 35.87 27.15 34.27 28.75 33.29C30.35 32.31 31.9 32.1 33.5 31.88C35.1 31.66 36.65 31.04 38.25 29.81C39.85 28.58 41.38 27.07 43 26.3" stroke-width="2.1"/></svg>Deskworlds</h1>
    </header>
    <main class="gallery" aria-label="Worlds" aria-roledescription="carousel" aria-describedby="gallery-help" aria-keyshortcuts="ArrowLeft ArrowRight">
      <p class="sr-only" id="gallery-help">滑动、选择相邻预览，或使用左右方向键在六个世界中挑选一个；列表会循环滚动。点击选中的图片或名称进入。</p>
      <p class="sr-only" id="gallery-status" role="status" aria-live="polite" aria-atomic="true">河床</p>
      <a draggable="false" class="portal river is-active" id="river" href="scenes/riverscape/" aria-label="打开河床">
        <div class="portal-image">
          <span class="preview-status" hidden>预览不可用</span>
          <img draggable="false" src="docs/images/riverscape-wide.png" alt="鱼群游过绿色的河草与沉木" width="1440" height="750" fetchpriority="high" />
        </div>
        <div class="portal-caption">
          <h2>河床<span class="enter" aria-hidden="true">↗</span></h2>
        </div>
      </a>
      <a draggable="false" class="portal reef" id="reef" role="button" href="scenes/reefscape/" aria-label="预览珊瑚礁">
        <div class="portal-image">
          <span class="preview-status" hidden>预览不可用</span>
          <img draggable="false" src="docs/images/reefscape-wide.png" alt="生长着小丑鱼、海葵和分支珊瑚的珊瑚礁" width="1440" height="750" />
        </div>
        <div class="portal-caption">
          <h2>珊瑚礁<span class="enter" aria-hidden="true">↗</span></h2>
        </div>
      </a>
      <a draggable="false" class="portal betta" id="betta" role="button" href="scenes/bettascape/" aria-label="预览斗鱼">
        <div class="portal-image">
          <span class="preview-status" hidden>预览不可用</span>
          <img draggable="false" src="docs/images/bettascape-wide.png" alt="一条半月斗鱼舒展长鳍悬于黑色背景前" width="1440" height="750" />
        </div>
        <div class="portal-caption">
          <h2>斗鱼<span class="enter" aria-hidden="true">↗</span></h2>
        </div>
      </a>
      <a draggable="false" class="portal plasma" id="plasma" role="button" href="scenes/plasmascape/" aria-label="预览等离子球">
        <div class="portal-image">
          <span class="preview-status" hidden>预览不可用</span>
          <img draggable="false" src="docs/images/plasmascape-wide.png" alt="昏暗房间中胡桃木桌上发光的等离子球，紫色电弧从电极延伸到玻璃壳" width="1440" height="750" />
        </div>
        <div class="portal-caption">
          <h2>等离子球<span class="enter" aria-hidden="true">↗</span></h2>
        </div>
      </a>
      <a draggable="false" class="portal koi" id="koi" role="button" href="scenes/koiscape/" aria-label="预览锦鲤池">
        <div class="portal-image">
          <span class="preview-status" hidden>预览不可用</span>
          <img draggable="false" src="docs/images/koiscape-wide.png" alt="数色锦鲤在荷叶下的暗色水面上滑行，俯视视角" width="1440" height="750" />
        </div>
        <div class="portal-caption">
          <h2>锦鲤池<span class="enter" aria-hidden="true">↗</span></h2>
        </div>
      </a>
      <a draggable="false" class="portal bonfire" id="bonfire" role="button" href="scenes/bonfirescape/" aria-label="预览篝火">
        <div class="portal-image">
          <span class="preview-status" hidden>预览不可用</span>
          <img draggable="false" src="docs/images/bonfirescape-wide.png" alt="黑夜中燃烧的篝火，一把盘绕的剑插在焦黑的木柴间，火星升腾" width="1440" height="750" />
        </div>
        <div class="portal-caption">
          <h2>篝火<span class="enter" aria-hidden="true">↗</span></h2>
        </div>
      </a>
    </main>
    <script type="module" src="ui/gallery.js"></script>
  </body>
</html>
