<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050a08" />
    <meta
      name="description"
      content="俯视视角下，锦鲤游弋于暗色庭园池塘的流动水面之下。本地运行的交互式 3D 预览。"
    />
    <title>锦鲤池 • Deskworlds</title>
    <link rel="icon" href="../../ui/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="stage" aria-label="交互式锦鲤池">
      <canvas
        id="scene"
        tabindex="0"
        aria-label="锦鲤在荷叶下的暗色池水中滑行，俯视视角。点击投喂。缓慢移动光标，鱼群会游向它。空格暂停。F 全屏。H 隐藏控制。"
      ></canvas>
      <nav class="chrome" aria-label="世界">
        <a class="home-link" href="../../" aria-label="Deskworlds 首页">Deskworlds</a>
        <div class="scene-nav">
          <a href="../riverscape/">河床</a>
          <a href="../reefscape/">珊瑚礁</a>
          <a href="../bettascape/">斗鱼</a>
          <a href="../plasmascape/">等离子球</a>
          <span aria-current="page">锦鲤池</span>
          <a href="../bonfirescape/">篝火</a>
        </div>
      </nav>
      <footer class="chrome" aria-label="世界控制">
        <div class="buttons">
          <button disabled id="pause" aria-pressed="false" title="空格">暂停</button>
          <button disabled id="feed">投喂</button>
          <button disabled id="fullscreen" title="F">全屏</button>
        </div>
        <div class="preferences">
          <select disabled id="quality" aria-label="画质">
            <option value="eco">节能</option>
            <option value="balanced" selected>均衡</option>
            <option value="detail">精细</option>
          </select>
          <button disabled id="hide" title="H">隐藏控制</button>
        </div>
      </footer>
      <button disabled id="show-controls" title="H">显示控制</button>
      <div id="loading" role="status"><p>世界加载中…</p></div>
      <div id="error" role="alert" hidden></div>
    </main>
    <script type="module" src="../shared/start.js" data-entry="./src/main.js"></script>
  </body>
</html>
